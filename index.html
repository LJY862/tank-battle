<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>坦克大战 Tank Battle</title>
<style>
  :root {
    --bg: #0f1216;
    --panel: #1a1f27;
    --text: #e8edf2;
    --accent: #f5c842;
    --green: #6fbf4a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: radial-gradient(circle at 50% 0%, #1a222e 0%, var(--bg) 70%);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  .wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px; }

  .hud {
    display: flex; align-items: center; gap: 18px;
    background: var(--panel);
    border: 1px solid #2a323d;
    border-radius: 10px;
    padding: 8px 18px;
    font-size: 15px;
    box-shadow: 0 4px 18px rgba(0,0,0,.35);
    flex-wrap: wrap; justify-content: center;
  }
  .hud .item { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .hud .label { color: #9aa7b4; font-size: 12px; letter-spacing: .5px; }
  .hud .val { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; min-width: 20px; }
  .lives .val { color: #ff6b6b; letter-spacing: 2px; }
  .hud .p-icon { width: 14px; height: 14px; border-radius: 3px; background: #4a9d3f; display: inline-block; }

  canvas {
    background: #000;
    border: 2px solid #2a323d;
    border-radius: 10px;
    box-shadow: 0 8px 30px rgba(0,0,0,.5);
    image-rendering: pixelated;
    max-width: 100%;
    height: auto;
  }

  .hint { color: #7c8996; font-size: 12px; text-align: center; line-height: 1.6; }
  .hint b { color: #b9c4cf; }

  /* 触屏方向键 */
  .touch { display: none; width: 100%; max-width: 460px; gap: 10px; margin-top: 4px; }
  .dpad {
    display: grid; grid-template-columns: repeat(3, 54px); grid-template-rows: repeat(3, 54px);
    gap: 4px; justify-content: center;
  }
  .dpad button, .fire-btn {
    border: 1px solid #3a4552; background: #232b36; color: #dfe7ef;
    font-size: 20px; border-radius: 10px; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .dpad button:active, .fire-btn:active { background: #37424f; }
  .dpad .up    { grid-column: 2; grid-row: 1; }
  .dpad .left  { grid-column: 1; grid-row: 2; }
  .dpad .right { grid-column: 3; grid-row: 2; }
  .dpad .down  { grid-column: 2; grid-row: 3; }
  .fire-btn {
    flex: 1; font-size: 15px; letter-spacing: 2px; color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    max-width: 120px; height: 54px; align-self: center;
  }
  .touch .fire-btn { max-width: 140px; }

  @media (pointer: coarse) {
    .touch { display: flex; }
    .hint .desk { display: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="hud">
      <div class="item"><span class="label">得分</span><span class="val" id="hud-score">0</span></div>
      <div class="item lives"><span class="label">生命</span><span class="val" id="hud-lives">♥♥♥</span></div>
      <div class="item"><span class="label">关卡</span><span class="val" id="hud-level">1</span></div>
      <div class="item"><span class="label">敌方坦克</span><span class="val" id="hud-enemies">0</span></div>
    </div>

    <canvas id="game" width="416" height="416"></canvas>

    <div class="hint desk">
      移动：<b>WASD / 方向键</b> 　 射击：<b>空格 / J</b> 　 开始/暂停：<b>Enter</b> 　 静音：<b>M</b>
    </div>

    <div class="touch">
      <div class="dpad">
        <button class="up" data-dir="up">▲</button>
        <button class="left" data-dir="left">◀</button>
        <button class="right" data-dir="right">▶</button>
        <button class="down" data-dir="down">▼</button>
      </div>
      <button class="fire-btn">🔥 射击</button>
    </div>
  </div>

<script>
"use strict";

// ================= 常量 =================
const TILE = 16;                 // 每个小格像素
const COLS = 26, ROWS = 26;      // 26 x 26 小格
const W = COLS * TILE, H = ROWS * TILE;   // 416 x 416
const TANK = 28;                 // 坦克碰撞盒（略小于 32 的通道）
const BULLET = 6;                // 子弹尺寸
const PLAYER_SPEED = 135;        // px / 秒
const BULLET_SPEED = 420;
const ENEMY_LIMIT = 4;           // 同屏最大敌人数

// 地形类型
const T = { EMPTY: 0, BRICK: 1, STEEL: 2, WATER: 3, GRASS: 4, BASE: 5 };

// 方向向量
const DIR = {
  up:    { x: 0, y: -1, a: 0 },
  right: { x: 1, y: 0,  a: Math.PI / 2 },
  down:  { x: 0, y: 1,  a: Math.PI },
  left:  { x: -1, y: 0, a: -Math.PI / 2 },
};
const DIRS = ["up", "right", "down", "left"];
const OPPOSITE = { up: "down", down: "up", left: "right", right: "left" };

// ================= 地图 =================
// 字符含义：#砖块 %钢铁 ~水 *草丛 .敌人出生点(空)
const MAP = [
  ".           .           .",
  "                        ",
  "  ##    ##    ##    ##  ",
  "  ##    ##    ##    ##  ",
  "      ####    ####      ",
  "      ####    ####      ",
  "  ##    ##    ##    ##  ",
  "  ##    ##    ##    ##  ",
  "                        ",
  "%%        ##  ##      %%",
  "                        ",
  "  ####            ####  ",
  "  ####            ####  ",
  "  ##    ~~    ~~    ##  ",
  "  ##    ~~    ~~    ##  ",
  "        ##  ##          ",
  "        ##  ##          ",
  "  ##  ##        ##  ##  ",
  "  ##  ##        ##  ##  ",
  "        **  **          ",
  "        **  **          ",
  "  ##            ##      ",
  "  ##            ##      ",
  "                        ",
  "                        ",
  "                        ",
];

// ================= 全局状态 =================
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const hudScore = document.getElementById("hud-score");
const hudLives = document.getElementById("hud-lives");
const hudLevel = document.getElementById("hud-level");
const hudEnemies = document.getElementById("hud-enemies");

let grid = [];
let state = "menu";   // menu | playing | paused | gameover | victory
let score = 0, lives = 3, level = 1;
let player = null;
let enemies = [], bullets = [], particles = [], powerups = [];
let enemyQueue = [], spawnTimer = 0, spawnFlash = 0;
let levelClearTimer = 0;
let shake = 0;

const keys = {};
let muted = false;

// ================= 音频 =================
let audioCtx = null;
function initAudio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}
function beep(freq, dur, type = "square", vol = 0.06) {
  if (muted || !audioCtx) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.value = vol;
  g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + dur);
}
const sfx = {
  shoot: () => beep(700, 0.06, "square", 0.05),
  hit:   () => beep(180, 0.1, "sawtooth", 0.06),
  boom:  () => { beep(120, 0.18, "sawtooth", 0.08); beep(60, 0.22, "triangle", 0.07); },
  power: () => { beep(520, 0.08); setTimeout(() => beep(780, 0.1), 80); },
  lose:  () => { beep(300, 0.2, "sawtooth"); setTimeout(() => beep(150, 0.4, "sawtooth"), 180); },
  win:   () => { [440, 554, 659, 880].forEach((f, i) => setTimeout(() => beep(f, 0.14), i * 120)); },
};

// ================= 工具函数 =================
function buildGrid() {
  grid = [];
  for (let r = 0; r < ROWS; r++) {
    const line = (MAP[r] || "").padEnd(COLS, " ").slice(0, COLS);
    const row = [];
    for (let c = 0; c < COLS; c++) {
      const ch = line[c];
      if (ch === "#") row.push(T.BRICK);
      else if (ch === "%") row.push(T.STEEL);
      else if (ch === "~") row.push(T.WATER);
      else if (ch === "*") row.push(T.GRASS);
      else row.push(T.EMPTY);
    }
    grid.push(row);
  }
  // 基地（老鹰）占据底部中央 2x2 格
  const bc = 12, br = 24;
  for (let r = br; r < br + 2; r++) for (let c = bc; c < bc + 2; c++) grid[r][c] = T.BASE;
  // 基地周围的砖墙
  const guards = [[bc-1, br-1], [bc, br-1], [bc+1, br-1], [bc+2, br-1],
                  [bc-1, br], [bc+2, br], [bc-1, br+1], [bc+2, br+1]];
  for (const [c, r] of guards) if (grid[r][c] !== T.BASE) grid[r][c] = T.BRICK;
}

function tileType(c, r) {
  if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return T.STEEL; // 边界视作钢铁
  return grid[r][c];
}

function solidForTank(t) {
  return t === T.BRICK || t === T.STEEL || t === T.WATER || t === T.BASE;
}

// 矩形是否撞到（对坦克）的实心格子
function rectHitsSolid(x, y, size) {
  const c0 = Math.floor(x / TILE), c1 = Math.floor((x + size - 0.01) / TILE);
  const r0 = Math.floor(y / TILE), r1 = Math.floor((y + size - 0.01) / TILE);
  for (let r = r0; r <= r1; r++)
    for (let c = c0; c <= c1; c++)
      if (solidForTank(tileType(c, r))) return true;
  return false;
}

function aabb(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

function rand(n) { return Math.random() * n; }
function randInt(n) { return Math.floor(Math.random() * n); }

// ================= 粒子/爆炸 =================
function explode(x, y, big) {
  const n = big ? 22 : 12;
  for (let i = 0; i < n; i++) {
    const a = rand(Math.PI * 2), sp = big ? rand(90) + 30 : rand(70) + 20;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.4) + 0.2, c: big ? "#ff9f43" : "#ffd166", r: rand(3) + 1.5 });
  }
}

// ================= 实体工厂 =================
function makePlayer() {
  const px = 12 * TILE + (TILE * 2 - TANK) / 2;   // 底部中央
  const py = 22 * TILE + (TILE * 2 - TANK) / 2;
  return {
    x: px, y: py, dir: "up", type: "player",
    speed: PLAYER_SPEED, w: TANK, h: TANK,
    cooldown: 0, level: 1, invincible: 3, shield: 0,
  };
}

function makeEnemy(kind) {
  const spawns = [[0, 0], [12 * TILE + 2, 0], [24 * TILE + 2, 0]];
  const [sx, sy] = spawns[randInt(spawns.length)];
  const kinds = {
    basic: { speed: 68,  hp: 1, color: "#d64545", score: 100, rate: 1.6 },
    fast:  { speed: 108, hp: 1, color: "#e8a13c", score: 200, rate: 1.2 },
    power: { speed: 72,  hp: 1, color: "#7fd13c", score: 300, rate: 0.7 },
    armor: { speed: 60,  hp: 3, color: "#b0b7c0", score: 400, rate: 1.3 },
  };
  const k = kinds[kind] || kinds.basic;
  return {
    x: sx, y: sy, dir: "down", type: "enemy", kind,
    speed: k.speed, hp: k.hp, color: k.color, score: k.score, rate: k.rate,
    w: TANK, h: TANK, cooldown: rand(0.8) + 0.4,
    turnTimer: rand(1.5) + 0.8, stuck: 0,
  };
}

function makeBullet(owner, x, y, dir, speed) {
  return { owner, x, y, dir, speed, w: BULLET, h: BULLET, alive: true };
}

function makePowerup(x, y) {
  const types = ["star", "shield", "life", "bomb"];
  const weights = [0.35, 0.25, 0.15, 0.25];
  let r = Math.random(), acc = 0, t = "star";
  for (let i = 0; i < types.length; i++) { acc += weights[i]; if (r < acc) { t = types[i]; break; } }
  return { x, y, type: t, w: 20, h: 20, life: 12, blink: 0 };
}

// ================= 关卡初始化 =================
function startLevel() {
  buildGrid();
  player = makePlayer();
  enemies = []; bullets = []; particles = []; powerups = [];
  const total = Math.min(4 + level * 3, 20);
  enemyQueue = [];
  for (let i = 0; i < total; i++) {
    // 高关卡出现更多强力敌人
    let kind = "basic";
    const rr = Math.random();
    if (level >= 2 && rr < 0.15) kind = "fast";
    if (level >= 3 && rr < 0.30) kind = "power";
    if (level >= 3 && rr < 0.42) kind = "armor";
    if (level >= 1 && rr < 0.10) kind = "fast";
    enemyQueue.push(kind);
  }
  spawnTimer = 0.6; spawnFlash = 0;
  levelClearTimer = 0;
  state = "playing";
  updateHud();
}

function resetGame() {
  score = 0; lives = 3; level = 1;
  startLevel();
}

// ================= 输入 =================
function keyDir(k) {
  if (k === "ArrowUp" || k === "w" || k === "W") return "up";
  if (k === "ArrowDown" || k === "s" || k === "S") return "down";
  if (k === "ArrowLeft" || k === "a" || k === "A") return "left";
  if (k === "ArrowRight" || k === "d" || k === "D") return "right";
  return null;
}

window.addEventListener("keydown", (e) => {
  initAudio();
  const k = e.key;
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(k)) e.preventDefault();

  if (k === "m" || k === "M") { muted = !muted; return; }

  if (state === "menu" && (k === "Enter" || k === " ")) { resetGame(); return; }
  if ((state === "gameover" || state === "victory") && k === "Enter") { resetGame(); return; }
  if (k === "Enter") { if (state === "playing") state = "paused"; else if (state === "paused") state = "playing"; return; }
  if (state !== "playing") return;

  const d = keyDir(k);
  if (d) keys[d] = true;
  if (k === " " || k === "j" || k === "J") keys.fire = true;
});

window.addEventListener("keyup", (e) => {
  const d = keyDir(e.key);
  if (d) keys[d] = false;
  if (e.key === " " || e.key === "j" || e.key === "J") keys.fire = false;
});

// 触屏
const touchDirs = {};
document.querySelectorAll(".dpad button").forEach(btn => {
  const d = btn.dataset.dir;
  const on = (e) => { e.preventDefault(); initAudio(); touchDirs[d] = true; };
  const off = (e) => { e.preventDefault(); touchDirs[d] = false; };
  btn.addEventListener("touchstart", on, { passive: false });
  btn.addEventListener("touchend", off, { passive: false });
  btn.addEventListener("touchcancel", off);
  btn.addEventListener("mousedown", on);
  btn.addEventListener("mouseup", off);
  btn.addEventListener("mouseleave", off);
});
const fireBtn = document.querySelector(".fire-btn");
fireBtn.addEventListener("touchstart", (e) => { e.preventDefault(); initAudio(); keys.fire = true; }, { passive: false });
fireBtn.addEventListener("touchend", () => { keys.fire = false; });
fireBtn.addEventListener("mousedown", () => { initAudio(); keys.fire = true; });
fireBtn.addEventListener("mouseup", () => { keys.fire = false; });

canvas.addEventListener("click", () => { initAudio(); if (state === "menu" || state === "gameover" || state === "victory") resetGame(); });

// ================= 更新逻辑 =================
function updateHud() {
  hudScore.textContent = score;
  hudLives.textContent = "♥".repeat(Math.max(0, lives));
  hudLevel.textContent = level;
  hudEnemies.textContent = enemyQueue.length + enemies.length;
}

function tryMove(e, nx, ny) {
  if (nx < 0 || ny < 0 || nx + e.w > W || ny + e.h > H) return false;
  if (rectHitsSolid(nx, ny, e.w)) return false;
  // 与其他坦克碰撞
  const box = { x: nx, y: ny, w: e.w, h: e.h };
  const others = e.type === "player" ? enemies : [player].filter(Boolean).concat(enemies.filter(t => t !== e));
  for (const o of others) {
    if (!o || o === e) continue;
    if (aabb(box, { x: o.x, y: o.y, w: o.w, h: o.h })) return false;
  }
  return true;
}

function moveEntity(e, dir, dt) {
  const v = DIR[dir];
  const sp = e.speed * dt;
  let nx = e.x, ny = e.y;
  if (v.x !== 0) { nx += v.x * sp; if (!tryMove(e, nx, e.y)) nx = e.x; }
  else if (v.y !== 0) { ny += v.y * sp; if (!tryMove(e, e.x, ny)) ny = e.y; }
  const moved = (nx !== e.x || ny !== e.y);
  e.x = nx; e.y = ny;
  if (moved) e.dir = dir;
  return moved;
}

function fire(e) {
  if (e.cooldown > 0) return;
  const cx = e.x + e.w / 2, cy = e.y + e.h / 2;
  const v = DIR[e.dir];
  const off = e.w / 2 + 2;
  bullets.push(makeBullet(e, cx + v.x * off, cy + v.y * off, e.dir,
    e.type === "player" ? BULLET_SPEED : BULLET_SPEED * 0.7));
  e.cooldown = e.type === "player" ? 0.16 : e.rate;
  if (e.type === "player") sfx.shoot();
}

function damageEnemy(e, dmg) {
  e.hp -= dmg;
  if (e.hp <= 0) {
    score += e.score;
    explode(e.x + e.w / 2, e.y + e.h / 2, true);
    sfx.boom();
    removeEnemy(e);
    // 掉落道具
    if (Math.random() < 0.22) powerups.push(makePowerup(e.x + e.w / 2 - 10, e.y + e.h / 2 - 10));
  } else {
    explode(e.x + e.w / 2, e.y + e.h / 2, false);
    sfx.hit();
    e.color = "#ffffff";
    setTimeout(() => { if (e) e.color = "restore"; }, 60);
  }
  updateHud();
}

function removeEnemy(e) {
  const i = enemies.indexOf(e);
  if (i >= 0) enemies.splice(i, 1);
}

function killPlayer() {
  explode(player.x + player.w / 2, player.y + player.h / 2, true);
  sfx.lose();
  shake = 0.35;
  lives--;
  updateHud();
  if (lives <= 0) { state = "gameover"; return; }
  // 重生，短暂无敌
  const np = makePlayer();
  np.invincible = 3;
  np.level = player.level;   // 保留升级？重生后重置为 1 更公平
  np.level = 1;
  player = np;
}

function hitBase() {
  explode(13 * TILE, 25 * TILE, true);
  sfx.lose();
  shake = 0.5;
  // 基地被打爆 -> 游戏结束
  state = "gameover";
}

function updateBullets(dt) {
  for (const b of bullets) {
    if (!b.alive) continue;
    const v = DIR[b.dir];
    b.x += v.x * b.speed * dt;
    b.y += v.y * b.speed * dt;
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;

    // 出界
    if (cx < 0 || cx > W || cy < 0 || cy > H) { b.alive = false; continue; }

    // 撞击地形（取子弹中心所在格）
    const c = Math.floor(cx / TILE), r = Math.floor(cy / TILE);
    const t = tileType(c, r);
    if (t === T.BRICK) {
      grid[r][c] = T.EMPTY;
      explode(c * TILE + TILE / 2, r * TILE + TILE / 2, false);
      sfx.hit();
      b.alive = false; continue;
    } else if (t === T.STEEL) {
      if (b.owner.type === "player" && b.owner.level >= 3) {
        grid[r][c] = T.EMPTY;
        explode(c * TILE + TILE / 2, r * TILE + TILE / 2, false);
        sfx.hit();
      }
      b.alive = false; continue;
    } else if (t === T.BASE) {
      hitBase(); b.alive = false; continue;
    }
    // 水与草丛子弹可穿过

    // 命中坦克
    const bb = { x: b.x, y: b.y, w: b.w, h: b.h };
    if (b.owner.type === "player") {
      for (const e of enemies) {
        if (aabb(bb, { x: e.x, y: e.y, w: e.w, h: e.h })) {
          b.alive = false; damageEnemy(e, 1); break;
        }
      }
    } else {
      if (player && aabb(bb, { x: player.x, y: player.y, w: player.w, h: player.h })) {
        b.alive = false;
        if (player.invincible > 0 || player.shield > 0) { explode(cx, cy, false); }
        else killPlayer();
      }
    }
  }
  bullets = bullets.filter(b => b.alive);
}

function updatePlayer(dt) {
  const p = player;
  p.cooldown -= dt;
  if (p.invincible > 0) p.invincible -= dt;
  if (p.shield > 0) p.shield -= dt;

  let dir = null;
  for (const d of DIRS) if (keys[d] || touchDirs[d]) dir = d;
  if (dir) moveEntity(p, dir, dt);
  if (keys.fire) fire(p);
}

function updateEnemies(dt) {
  for (const e of enemies) {
    e.cooldown -= dt;
    e.turnTimer -= dt;
    const cx = e.x + e.w / 2, cy = e.y + e.h / 2;
    const pcx = player ? player.x + player.w / 2 : W / 2;
    const pcy = player ? player.y + player.h / 2 : H / 2;

    // 需要转向
    if (e.turnTimer <= 0 || e.stuck > 0) {
      e.turnTimer = rand(1.2) + 0.6;
      const options = [];
      // 朝玩家方向加权
      const dx = pcx - cx, dy = pcy - cy;
      const pref = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
      options.push(pref, pref);
      for (const d of DIRS) options.push(d);
      // 尝试随机选一个能走的方向
      const tried = new Set();
      for (let i = 0; i < options.length; i++) {
        const d = options[randInt(options.length)];
        if (tried.has(d)) continue;
        tried.add(d);
        const v = DIR[d];
        const nx = e.x + v.x * 4, ny = e.y + v.y * 4;
        if (tryMove(e, nx, ny)) { e.dir = d; e.stuck = 0; break; }
      }
    }

    const moved = moveEntity(e, e.dir, dt);
    if (!moved) e.stuck++;

    // 射击：与玩家大致对齐时
    const aligned = Math.abs(cx - pcx) < 8 || Math.abs(cy - pcy) < 8;
    if (aligned && e.cooldown <= 0 && Math.random() < 0.6) fire(e);
  }
}

function updatePowerups(dt) {
  for (const pu of powerups) {
    pu.life -= dt; pu.blink += dt;
    if (player && aabb({ x: pu.x, y: pu.y, w: pu.w, h: pu.h },
                       { x: player.x, y: player.y, w: player.w, h: player.h })) {
      applyPowerup(pu);
      pu.life = 0;
    }
  }
  powerups = powerups.filter(p => p.life > 0);
}

function applyPowerup(pu) {
  sfx.power();
  if (pu.type === "star") {
    player.level = Math.min(3, player.level + 1);
  } else if (pu.type === "shield") {
    player.shield = 8;
  } else if (pu.type === "life") {
    lives = Math.min(9, lives + 1);
  } else if (pu.type === "bomb") {
    for (const e of [...enemies]) { explode(e.x + e.w / 2, e.y + e.h / 2, true); score += e.score; }
    enemies = []; sfx.boom();
  }
  updateHud();
}

function updateSpawn(dt) {
  if (enemyQueue.length === 0 && enemies.length === 0 && state === "playing") {
    // 关卡清空
    if (levelClearTimer === 0) sfx.win();
    levelClearTimer += dt;
    if (levelClearTimer > 1.5) { level++; startLevel(); }
    return;
  }
  if (enemyQueue.length > 0 && enemies.length < ENEMY_LIMIT) {
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      enemies.push(makeEnemy(enemyQueue.shift()));
      spawnTimer = 1.6;
      spawnFlash = 0.3;
      updateHud();
    }
  }
}

function update(dt) {
  if (state !== "playing") return;
  updatePlayer(dt);
  updateEnemies(dt);
  updateBullets(dt);
  updatePowerups(dt);
  updateSpawn(dt);
  updateHud();
  if (shake > 0) shake -= dt;
  if (player && state === "playing" && player.invincible <= 0 && player.shield <= 0) {
    // 与敌人相撞时玩家也会受伤（经典设定）
    for (const e of enemies) {
      if (aabb({ x: player.x, y: player.y, w: player.w, h: player.h },
               { x: e.x, y: e.y, w: e.w, h: e.h })) { killPlayer(); break; }
    }
  }
}

// ================= 渲染 =================
function drawTank(e) {
  if (!e) return;
  const cx = e.x + e.w / 2, cy = e.y + e.h / 2;
  const size = TANK + 2;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(DIR[e.dir].a);

  let body = e.color;
  if (e.type === "player") {
    body = player.level >= 3 ? "#8fd14f" : player.level === 2 ? "#5cb85c" : "#e6c44a";
    if (player.shield > 0) body = "#4fc3f7";
    if (player.invincible > 0 && Math.floor(player.invincible * 8) % 2 === 0) body = "#ffffff";
  } else if (e.color === "restore") {
    body = { basic: "#d64545", fast: "#e8a13c", power: "#7fd13c", armor: "#b0b7c0" }[e.kind] || "#d64545";
  }

  // 履带
  ctx.fillStyle = "#23262b";
  ctx.fillRect(-size / 2, -size / 2, size, 5);
  ctx.fillRect(-size / 2, size / 2 - 5, size, 5);
  ctx.fillStyle = "#3a3f47";
  for (let i = -size / 2 + 2; i < size / 2 - 2; i += 5) {
    ctx.fillRect(i, -size / 2, 2, 5);
    ctx.fillRect(i, size / 2 - 5, 2, 5);
  }
  // 车身
  ctx.fillStyle = body;
  ctx.fillRect(-size / 2 + 3, -size / 2 + 5, size - 6, size - 10);
  ctx.fillStyle = "rgba(0,0,0,0.18)";
  ctx.fillRect(-size / 2 + 3, -size / 2 + 5, size - 6, 3);
  // 炮塔
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.fill();
  // 炮管
  ctx.fillStyle = body;
  ctx.fillRect(-2, -size / 2 - 3, 4, 9);

  ctx.restore();
}

function drawBullet(b) {
  ctx.save();
  ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
  ctx.fillStyle = b.owner.type === "player" ? "#fff2a8" : "#ffd0d0";
  ctx.beginPath(); ctx.arc(0, 0, 3, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawBrick(c, r) {
  const x = c * TILE, y = r * TILE;
  ctx.fillStyle = "#b34a2e";
  ctx.fillRect(x, y, TILE, TILE);
  ctx.strokeStyle = "#7a2f1c";
  ctx.lineWidth = 1;
  // 砖缝
  ctx.beginPath();
  ctx.moveTo(x, y + 8); ctx.lineTo(x + TILE, y + 8);
  ctx.moveTo(x + 8, y); ctx.lineTo(x + 8, y + 8);
  ctx.moveTo(x + 4, y + 8); ctx.lineTo(x + 4, y + TILE);
  ctx.moveTo(x + 12, y + 8); ctx.lineTo(x + 12, y + TILE);
  ctx.stroke();
}

function drawSteel(c, r) {
  const x = c * TILE, y = r * TILE;
  ctx.fillStyle = "#8b96a3";
  ctx.fillRect(x, y, TILE, TILE);
  ctx.fillStyle = "#b9c4cf";
  ctx.fillRect(x, y, TILE, 3);
  ctx.fillRect(x, y, 3, TILE);
  ctx.fillStyle = "#5c6570";
  ctx.fillRect(x + 3, y + TILE - 3, TILE - 3, 3);
  ctx.fillRect(x + TILE - 3, y + 3, 3, TILE - 3);
}

function drawWater(c, r) {
  const x = c * TILE, y = r * TILE;
  ctx.fillStyle = "#1f6fb2";
  ctx.fillRect(x, y, TILE, TILE);
  ctx.fillStyle = "#4aa3e0";
  const t = performance.now() / 500;
  for (let i = 0; i < 2; i++) {
    const yy = y + ((i * 8 + t * 12) % 16);
    ctx.fillRect(x + 2, yy, 4, 3);
    ctx.fillRect(x + 10, yy + 6, 4, 3);
  }
}

function drawGrass(c, r) {
  const x = c * TILE, y = r * TILE;
  ctx.fillStyle = "#3f7d33";
  ctx.fillRect(x, y, TILE, TILE);
  ctx.fillStyle = "#58a648";
  ctx.fillRect(x + 2, y + 3, 4, 4);
  ctx.fillRect(x + 9, y + 8, 4, 4);
}

function drawBase(c, r) {
  const x = c * TILE, y = r * TILE;
  ctx.fillStyle = "#20242a";
  ctx.fillRect(x, y, TILE * 2, TILE * 2);
  // 老鹰标志
  const cx = x + TILE, cy = y + TILE;
  ctx.fillStyle = "#f5c842";
  ctx.beginPath();
  ctx.moveTo(cx - 11, cy + 6);
  ctx.lineTo(cx, cy - 10);
  ctx.lineTo(cx + 11, cy + 6);
  ctx.lineTo(cx + 5, cy + 2);
  ctx.lineTo(cx + 5, cy + 9);
  ctx.lineTo(cx - 5, cy + 9);
  ctx.lineTo(cx - 5, cy + 2);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = "#e8893c";
  ctx.fillRect(cx - 1.5, cy + 9, 3, 4);
}

function drawPowerup(pu) {
  if (Math.floor(pu.blink * 6) % 2 === 0) return;
  const x = pu.x, y = pu.y;
  const colors = { star: "#f5c842", shield: "#4fc3f7", life: "#ff6b6b", bomb: "#b37feb" };
  const label = { star: "★", shield: "🛡", life: "❤", bomb: "💣" };
  ctx.fillStyle = colors[pu.type];
  ctx.beginPath(); ctx.arc(x + 10, y + 10, 11, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(x + 10, y + 10, 11, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = "#111";
  ctx.font = "12px sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(label[pu.type], x + 10, y + 11);
}

function drawParticles(dt) {
  for (const p of particles) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    p.vy += 60 * dt;
    ctx.globalAlpha = Math.max(0, p.life * 3);
    ctx.fillStyle = p.c;
    ctx.fillRect(p.x - p.r / 2, p.y - p.r / 2, p.r, p.r);
  }
  ctx.globalAlpha = 1;
  particles = particles.filter(p => p.life > 0);
}

function drawGrid() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const t = grid[r][c];
      if (t === T.BRICK) drawBrick(c, r);
      else if (t === T.STEEL) drawSteel(c, r);
      else if (t === T.WATER) drawWater(c, r);
      else if (t === T.GRASS) drawGrass(c, r);
    }
  }
  // 基地绘制在最底层地形之上、坦克之下
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (grid[r][c] === T.BASE) drawBase(c, r);
}

function overlayText(title, sub, sub2) {
  ctx.fillStyle = "rgba(0,0,0,0.72)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.fillStyle = "#f5c842";
  ctx.font = "bold 34px 'Microsoft YaHei', sans-serif";
  ctx.fillText(title, W / 2, H / 2 - 26);
  if (sub) { ctx.fillStyle = "#e8edf2"; ctx.font = "16px 'Microsoft YaHei', sans-serif"; ctx.fillText(sub, W / 2, H / 2 + 8); }
  if (sub2) { ctx.fillStyle = "#9aa7b4"; ctx.font = "13px 'Microsoft YaHei', sans-serif"; ctx.fillText(sub2, W / 2, H / 2 + 34); }
}

function render() {
  ctx.clearRect(0, 0, W, H);
  // 背景
  ctx.fillStyle = "#0c0e11";
  ctx.fillRect(0, 0, W, H);

  drawGrid();

  // 道具（在草丛下方，坦克之间）
  for (const pu of powerups) drawPowerup(pu);

  // 敌人
  for (const e of enemies) drawTank(e);

  // 玩家
  drawTank(player);

  // 草丛：盖在坦克上方
  ctx.fillStyle = "#3f7d33";
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (grid[r][c] === T.GRASS) {
        ctx.fillRect(c * TILE, r * TILE, TILE, TILE);
        ctx.fillStyle = "#4c9641";
        ctx.fillRect(c * TILE + 3, r * TILE + 4, 5, 5);
        ctx.fillRect(c * TILE + 10, r * TILE + 9, 5, 5);
        ctx.fillStyle = "#3f7d33";
      }

  // 子弹
  for (const b of bullets) drawBullet(b);

  // 粒子
  drawParticles(1 / 60);

  // 出生闪光
  if (spawnFlash > 0) {
    ctx.globalAlpha = spawnFlash * 4;
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  // 屏幕震动
  if (shake > 0) {
    const m = shake * 18;
    ctx.save();
    ctx.translate(rand(m) - m / 2, rand(m) - m / 2);
  }

  if (state === "menu") overlayText("坦克大战", "按 Enter 或点击屏幕开始", "WASD/方向键移动 · 空格射击");
  else if (state === "paused") overlayText("暂停", "按 Enter 继续");
  else if (state === "gameover") overlayText("游戏结束", `最终得分：${score}`, "按 Enter 重新开始");
  else if (state === "victory") overlayText("胜利！", `最终得分：${score}`, "按 Enter 重新开始");
}

// ================= 主循环 =================
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  if (spawnFlash > 0) spawnFlash -= dt;
  render();
  requestAnimationFrame(loop);
}

// 初始画面
buildGrid();
updateHud();
requestAnimationFrame(loop);
</script>
</body>
</html>
